<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Water Flow Test</title>
  <style>
    body { margin: 0; height: 100vh; overflow: hidden; background: #F6F8FC; }
    .contour-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('/static/contour-minimalist.svg');
      background-repeat: repeat;
      background-size: 750px 750px;
      filter: url(#water-flow-filter);
    }
  </style>
</head>
<body>
  <svg style="position:absolute; width:0; height:0;" aria-hidden="true">
    <defs>
      <filter id="water-flow-filter" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence id="water-turb" type="fractalNoise" baseFrequency="0.009 0.012" numOctaves="1" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <div class="contour-layer" id="layer"></div>
  <script>
    let t = 0;
    const turb = document.getElementById('water-turb');
    function loop() {
      t += 0.012;
      const bx = 0.009 + 0.003 * Math.sin(t);
      const by = 0.012 + 0.004 * Math.cos(t * 0.8);
      turb.setAttribute('baseFrequency', `${bx.toFixed(5)} ${by.toFixed(5)}`);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
