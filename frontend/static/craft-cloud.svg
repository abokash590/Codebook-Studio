<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" fill="none">
  <defs>
    <!-- Crisp Halftone stipple dot pattern (4.6px pitch matching Craft.do) -->
    <pattern id="cloud-stipple" width="4.6" height="4.6" patternUnits="userSpaceOnUse">
      <circle cx="2.3" cy="2.3" r="1.15" fill="#FFFFFF" />
    </pattern>

    <!-- Soft diffuse blur filter for core cumulus body -->
    <filter id="cloud-blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="22" />
    </filter>

    <!-- Radial gradient mask for stipple dot matrix fade -->
    <radialGradient id="stipple-mask-grad" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.80" />
      <stop offset="68%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="95%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <mask id="stipple-mask">
      <ellipse cx="270" cy="130" rx="230" ry="95" fill="url(#stipple-mask-grad)" />
    </mask>
  </defs>

  <!-- Volumetric Soft Cumulus Body (Multiple overlapping organic puffs) -->
  <g filter="url(#cloud-blur)" opacity="0.82">
    <ellipse cx="270" cy="140" rx="185" ry="70" fill="#FFFFFF" />
    <circle cx="180" cy="120" r="70" fill="#FFFFFF" />
    <circle cx="340" cy="118" r="75" fill="#FFFFFF" />
    <circle cx="260" cy="95" r="72" fill="#FFFFFF" />
    <circle cx="120" cy="145" r="48" fill="#FFFFFF" />
    <circle cx="410" cy="140" r="54" fill="#FFFFFF" />
  </g>

  <!-- Crisp Halftone Stipple Dotted Matrix Overlay Layer -->
  <g mask="url(#stipple-mask)" opacity="0.92">
    <rect x="0" y="0" width="540" height="260" fill="url(#cloud-stipple)" />
  </g>
</svg>
